name: CI-CD Pre-Merge Validation

on:
  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 1. LINTING
      # ------------------------------------------------------------
      - name: Run Hadolint (Docker Lint)
        run: |
          echo "🔎 Searching for all Dockerfiles under src/..."
          find src/ -name "Dockerfile" | while read -r dockerfile; do
            echo "--------------------------------------------------"
            echo "📄 Scanning: $dockerfile"
            echo "--------------------------------------------------"
            docker run --rm -i hadolint/hadolint hadolint --verbose - < "$dockerfile"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Helm Dependency Update & Lint
        run: |
          echo "📦 Building master chart dependencies..."
          helm dependency update helm/salt-master --debug

          echo "📊 Linting salt-key-operator chart..."
          helm lint helm/salt-key-operator --debug

          echo "📊 Linting salt-master chart..."
          helm lint helm/salt-master --debug

          echo "📊 Linting salt-minion chart..."
          helm lint helm/salt-minion --debug

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Go Lint & Validate
        run: |
          if [ -d "src/salt-key-operator" ]; then
            cd src/salt-key-operator
            if [ -f "go.mod" ]; then
              echo "🔎 Running Go validation diagnostics..."
              go fmt ./...
              go vet ./...
            fi
          fi

      # ------------------------------------------------------------
      # 2. SET UP DOCKER BUILDX
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # 3. BUILD DOCKER IMAGES LOCALLY
      #
      # --load is required because Trivy scans the locally built images.
      # No images are pushed anywhere.
      # ------------------------------------------------------------
      - name: Build Docker Images Locally (No Push)
        run: |
          echo "➡️ Building Master Image..."
          docker buildx build src/master \
            --file src/master/Dockerfile \
            --load \
            -t salt-master:local \
            --cache-from type=gha,scope=master \
            --cache-to type=gha,mode=max,scope=master

          echo "➡️ Building Minion Kubernetes Image..."
          docker buildx build src/minion/kubernetes \
            --file src/minion/kubernetes/Dockerfile \
            --load \
            -t salt-minion-k8s:local \
            --cache-from type=gha,scope=minion-k8s \
            --cache-to type=gha,mode=max,scope=minion-k8s

          echo "➡️ Building Minion VCF Image..."
          docker buildx build src/minion/vcf \
            --file src/minion/vcf/Dockerfile \
            --load \
            -t salt-minion-vcf:local \
            --cache-from type=gha,scope=minion-vcf \
            --cache-to type=gha,mode=max,scope=minion-vcf

          echo "➡️ Building Key Operator Image..."
          docker buildx build src/salt-key-operator \
            --file src/salt-key-operator/Dockerfile \
            --load \
            -t salt-key-operator:local \
            --cache-from type=gha,scope=key-operator \
            --cache-to type=gha,mode=max,scope=key-operator

      # ------------------------------------------------------------
      # 4. TRIVY SECURITY VULNERABILITY SCANS
      # LOG-ONLY MODE: vulnerabilities do not fail the PR.
      # ------------------------------------------------------------
      - name: Scan salt-master image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'salt-master:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignore: '.trivyignore'

      - name: Scan salt-minion-k8s image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'salt-minion-k8s:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignore: '.trivyignore'

      - name: Scan salt-minion-vcf image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'salt-minion-vcf:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignore: '.trivyignore'

      - name: Scan salt-key-operator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'salt-key-operator:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ------------------------------------------------------------
      # 5. BUILD / PACKAGE HELM CHARTS
      # ------------------------------------------------------------
      - name: Test Build/Package Helm Charts
        run: |
          mkdir -p dist/

          helm package helm/salt-key-operator -d dist/
          helm package helm/salt-master -d dist/
          helm package helm/salt-minion -d dist/

      - name: List Build Outputss
        run: |
          echo "=== Docker Images Built ==="
          docker images | grep local || true

          echo "=== Helm Chart Archives ==="
          ls -lh dist/