{{- $secretName := .Values.agent.minion.keySecretName | default (printf "%s-keys" .Release.Name) -}}
{{- $existingSecret := lookup "v1" "Secret" .Values.namespace $secretName -}}
{{- if and (not .Values.agent.minion.keySecretName) (not $existingSecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-keygen
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: keygen
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              secret={{ $secretName | quote }}
              namespace={{ .Values.namespace | quote }}

              if kubectl get secret "$secret" -n "$namespace" >/dev/null 2>&1; then
                echo "Secret $secret already exists; skipping generation"
                exit 0
              fi

              temporary_directory="$(mktemp -d)"
              trap 'rm -rf "$temporary_directory"' EXIT

              openssl genpkey \
                -algorithm RSA \
                -pkeyopt rsa_keygen_bits:2048 \
                -out "$temporary_directory/minion.pem"

              openssl rsa \
                -pubout \
                -in "$temporary_directory/minion.pem" \
                -out "$temporary_directory/minion.pub"

              kubectl create secret generic "$secret" \
                --namespace "$namespace" \
                --from-file=minion.pem="$temporary_directory/minion.pem" \
                --from-file=minion.pub="$temporary_directory/minion.pub"
{{- end }}