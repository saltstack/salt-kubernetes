{{- $secretName := .Values.agent.minion.keySecretName | default (printf "%s-keys" .Release.Name) -}}
{{- if and .Values.agent.minion.privateKeyB64 .Values.agent.minion.publicKeyB64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-minion
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  private-key-b64: {{ .Values.agent.minion.privateKeyB64 | b64enc }}
  public-key-b64: {{ .Values.agent.minion.publicKeyB64 | b64enc }}
{{- end }}