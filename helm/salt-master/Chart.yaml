apiVersion: v2
name: salt-master
description: >-
  Installs a Salt master as a Kubernetes StatefulSet. Supports Salt master
  cluster mode (cluster_id/cluster_peers, isolated or shared storage) as well
  as classic multi-master with a shared keypair. Exposes the masters via a flat
  Service and a headless Service for per-ordinal DNS. Supports trusted-minion
  integration with the salt-key-operator side-car.
type: application
version: 1.1.0
appVersion: "1.0.0"
keywords:
  - salt
  - saltstack
  - kubernetes
maintainers:
  - name: salt-compliance-team

dependencies:
  - name: salt-key-operator
    version: ">=0.0.0"
    repository: "file://../salt-key-operator"
    condition: agent.trustedMinions.enabled
