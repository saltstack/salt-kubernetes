{{- $masterKeySecret := .Values.agent.masterKeySecretName | default (printf "%s-master-keys" .Release.Name) -}}
{{- $existingMasterKeySecret := lookup "v1" "Secret" .Values.namespace $masterKeySecret -}}
{{- if and (not .Values.agent.cluster.enabled) (not $existingMasterKeySecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-master-keygen
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.keygen.podSecurityContext | nindent 8 }}
      {{- with .Values.keygen.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The normal Salt Master pod does not need an API token, but this
      # one-time key-generation Job needs one to create the Secret.
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: master-keygen
          image: {{ printf "%s:%s" .Values.keygen.image.repository (toString .Values.keygen.image.tag) | quote }}
          imagePullPolicy: {{ .Values.keygen.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.keygen.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              secret={{ $masterKeySecret | quote }}
              namespace={{ .Values.namespace | quote }}

              if kubectl get secret "$secret" -n "$namespace" >/dev/null 2>&1; then
                echo "Secret $secret already exists; skipping generation"
                exit 0
              fi

              temporary_directory="$(mktemp -d)"
              trap 'rm -rf "$temporary_directory"' EXIT

              openssl genpkey \
                -algorithm RSA \
                -pkeyopt rsa_keygen_bits:2048 \
                -out "$temporary_directory/master.pem"

              openssl rsa \
                -pubout \
                -in "$temporary_directory/master.pem" \
                -out "$temporary_directory/master.pub"

              kubectl create secret generic "$secret" \
                -n "$namespace" \
                --from-file=master.pem="$temporary_directory/master.pem" \
                --from-file=master.pub="$temporary_directory/master.pub"
{{- end }}