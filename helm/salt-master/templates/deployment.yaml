apiVersion: apps/v1
kind: Deployment
metadata:
  name: salt-master
  namespace: {{ .Values.namespace }}
  labels:
    app: salt-master
    app.kubernetes.io/name: salt-master
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  selector:
    matchLabels:
      app: salt-master
  template:
    metadata:
      labels:
        app: salt-master
        app.kubernetes.io/name: salt-master
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      # Kubernetes Secret volumes are read-only. Salt needs its PKI
      # directory to be writable so it can secure the directory and create
      # minions_pre, minions_rejected and minions_denied.
      initContainers:
        - name: prepare-master-keys
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              cp /var/run/salt-master-keys/master.pem \
                 /etc/salt/pki/master/master.pem

              cp /var/run/salt-master-keys/master.pub \
                 /etc/salt/pki/master/master.pub

              chown -R 10001:10001 /etc/salt/pki/master
              chmod 0700 /etc/salt/pki/master
              chmod 0400 /etc/salt/pki/master/master.pem
              chmod 0644 /etc/salt/pki/master/master.pub
          volumeMounts:
            - name: master-keys-source
              mountPath: /var/run/salt-master-keys
              readOnly: true
            - name: master-keys
              mountPath: /etc/salt/pki/master
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE

      containers:
        - name: salt-master
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: SALT_AUTO_ACCEPT
              value: {{ .Values.agent.autoAccept | quote }}
            - name: SALT_PRESENCE_EVENTS
              value: {{ .Values.agent.presenceEvents | quote }}
          ports:
            - name: publish
              containerPort: 4505
            - name: ret
              containerPort: 4506
          volumeMounts:
            - name: master-keys
              mountPath: /etc/salt/pki/master
            {{- if .Values.agent.trustedMinions.enabled }}
            # These are writable directories populated by the
            # trusted-minions-sync sidecar.
            - name: trusted-minions-live
              mountPath: /etc/salt/pki/master/minions
            - name: trusted-minions-pre
              mountPath: /etc/salt/pki/master/minions_pre
            - name: trusted-minions-rejected
              mountPath: /etc/salt/pki/master/minions_rejected
            {{- end }}
          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}

        {{- if .Values.agent.trustedMinions.enabled }}
        - name: trusted-minions-sync
          # ConfigMap volume files are symlinks. Salt 3008 rejects symlinks
          # in its local key store, so copy them into writable emptyDirs.
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -u

              while true; do
                for f in /var/run/salt-key-operator/trusted-minions/*; do
                  [ -e "$f" ] || continue

                  b="$(basename "$f")"
                  cp -f "$f" "/etc/salt/pki/master/minions/$b"

                  # An accepted key must not also remain pending or rejected.
                  rm -f \
                    "/etc/salt/pki/master/minions_pre/$b" \
                    "/etc/salt/pki/master/minions_rejected/$b"
                done

                for f in /etc/salt/pki/master/minions/*; do
                  [ -e "$f" ] || continue

                  b="$(basename "$f")"

                  if [ ! -e "/var/run/salt-key-operator/trusted-minions/$b" ]; then
                    rm -f "$f"
                  fi
                done

                sleep {{ .Values.agent.trustedMinions.syncIntervalSeconds }}
              done
          volumeMounts:
            - name: trusted-minions-src
              mountPath: /var/run/salt-key-operator/trusted-minions
              readOnly: true
            - name: trusted-minions-live
              mountPath: /etc/salt/pki/master/minions
            - name: trusted-minions-pre
              mountPath: /etc/salt/pki/master/minions_pre
            - name: trusted-minions-rejected
              mountPath: /etc/salt/pki/master/minions_rejected
          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}

      volumes:
        # The generated/existing Secret is mounted separately and copied
        # into a writable emptyDir by prepare-master-keys.
        - name: master-keys-source
          secret:
            secretName: {{ .Values.agent.masterKeySecretName | default (printf "%s-master-keys" .Release.Name) }}
        - name: master-keys
          emptyDir: {}

        {{- if .Values.agent.trustedMinions.enabled }}
        - name: trusted-minions-src
          configMap:
            name: {{ .Values.agent.trustedMinions.configMapName }}
        - name: trusted-minions-live
          emptyDir: {}
        - name: trusted-minions-pre
          emptyDir: {}
        - name: trusted-minions-rejected
          emptyDir: {}
        {{- end }}