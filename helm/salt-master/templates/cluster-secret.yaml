{{- if and .Values.agent.cluster.enabled (not .Values.agent.cluster.secretName) }}
{{- /* Generated once, then reused: rotating cluster_secret on every upgrade would lock peers out. */ -}}
{{- $name := include "salt-master.clusterSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-master
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cluster-secret: {{ if $existing }}{{ index $existing.data "cluster-secret" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
