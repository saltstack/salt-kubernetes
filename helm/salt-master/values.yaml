# Namespace where all salt-master objects are deployed.
namespace: salt-master
rbac:
  create: true

agent:
  image:
    # Built from src/master/Dockerfile. Also published to
    # ghcr.io/saltstack/salt-master (see docs/releasing.md), but
    # this default is unqualified so a locally built image can be used as is:
    # load it into each node's container runtime, or set repository to the
    # GHCR path (or your own registry) to pull instead. The tag is the Salt
    # version the image was built with (3008.5).
    repository: salt-master
    tag: "3008.5"
    pullPolicy: IfNotPresent
    # Secrets for pulling the master image from a private registry, as a list
    # of {name: <secret>}. Used by the StatefulSet (and so by every init
    # container in it).
    imagePullSecrets: []

  # Number of master pods (StatefulSet replicas; pods are salt-master-0..N-1).
  #
  # 1 (default) = a single classic master.
  #
  # > 1 needs one of two modes:
  #  - classic multi-master (agent.cluster.enabled=false): requires
  #    agent.masterKeySecretName (the chart fails to render otherwise) because
  #    every replica must present the identical keypair. Only genuinely
  #    active-active for minions that address each replica individually, i.e.
  #    list the headless Service's per-pod DNS names
  #    (salt-master-<N>.salt-master-headless.<namespace>.svc.<clusterDomain>)
  #    in the minion's `master:` list. A single flat Service address in front
  #    of >1 classic replica only gives per-connection load balancing and
  #    failover, never "any replica can dispatch to any minion": that is
  #    inherent to Salt's per-process pub/sub.
  #  - master cluster (agent.cluster.enabled=true): requires >= 2 replicas
  #    (use 3 or more); see agent.cluster below.
  replicas: 1

  # Salt master cluster (Salt 3007+; the isolated-filesystem mode below needs
  # 3008+). Opt-in, and see the LIMITATION below before using it. Distinct from
  # the classic multi-master mode described above: all
  # masters present ONE cluster identity to minions, so a plain Service in
  # front of the StatefulSet (service.type/service.gateway) is the intended
  # minion endpoint - any replica can serve any minion, and jobs/events are
  # routed between peers. Each master keeps its OWN master keypair; the
  # cluster-wide keypair and the accepted minion keys live in cluster_pki_dir.
  # See https://docs.saltproject.io/en/3008/topics/tutorials/master-cluster.html
  #
  # When enabled: needs replicas >= 2 (the chart fails below that: Salt
  # refuses a member with no peers); use 3 or more to tolerate a failure.
  # masterKeySecretName and the master-keygen Job are not used (every master
  # generates and keeps its own keypair on its state volume), jobCache.persistence
  # is ignored (the state volume holds the cache in isolated mode), and
  # trustedMinions writes into <cluster_pki_dir>/minions instead. Each pod's
  # `interface` and `id` are set to its pod IP, and the pod's entrypoint waits
  # (up to 120s) for the other pods' DNS names to resolve before starting.
  # Minions point at the flat salt-master Service, not at individual pods.
  cluster:
    enabled: false
    # cluster_id. Defaults to the release name.
    id: ""
    # Cluster DNS suffix, used to build the per-pod peer names
    # salt-master-<N>.salt-master-headless.<namespace>.svc.<clusterDomain>.
    clusterDomain: cluster.local
    # cluster_pool_port: peer-to-peer RPC between masters (headless Service
    # and container port are added automatically). Must be reachable between
    # pods; never expose it outside the cluster.
    poolPort: 4520
    # Secret holding key 'cluster-secret' (cluster_secret: authenticates
    # masters joining the cluster). Empty = the chart creates
    # <release>-cluster-secret with a random value on first install and
    # keeps it across upgrades.
    secretName: ""
    # isolated: Salt 3008+ cluster_isolated_filesystem - every pod keeps its
    #   own cluster_pki_dir/cachedir on its own PVC and peers sync in-band.
    #   No shared storage required. file_roots/pillar_roots then have to be
    #   propagated with `salt-run cluster.sync_roots`.
    # shared: all pods mount one ReadWriteMany claim (NFS, CephFS, ...) for
    #   cluster_pki_dir, cachedir, file_roots and pillar_roots. Requires
    #   sharedStorage.existingClaim. Not yet tested with this chart.
    storageMode: isolated
    # cluster_auto_replace_voters (default false, same as Salt).
    #
    # LIMITATION: a master's cluster identity is its `interface`, which here
    # is the pod IP, and Salt has no setting to separate identity from bind
    # address. A pod IP changes whenever the pod is rescheduled or restarted,
    # so the restarted pod joins as a NEW learner while its old identity stays
    # a dead voter. Salt's own recovery, cluster_auto_replace_voters, is OFF by
    # default and was observed to demote a healthy voter instead of the dead
    # one (breaking quorum), so the chart leaves it off. Use hostNetwork
    # (below) so the identity is a stable node IP; without it, treat pod
    # restarts as unsupported. Replacing a voter also needs a majority of the
    # current voters, so use at least 3 replicas.
    autoReplaceVoters: false
    # cluster_min_voters: floor below which Salt will not demote a voter.
    # Empty = replicas - 1 (at least 1), i.e. one dead voter can always be
    # replaced (only relevant when autoReplaceVoters is true).
    minVoters: ""
    # Run the masters on the host network so each master's cluster identity is
    # its NODE's IP, which survives a pod restart (a pod IP does not; see the
    # known limitation). Needs agent.cluster.enabled. Each master then binds the
    # node's ports 4505, 4506 and poolPort, so the chart adds a required pod
    # anti-affinity (one master per node). A replacement pod keeps the same
    # identity only if it lands on the SAME node, so label exactly `replicas`
    # nodes and select them with agent.nodeSelector: then the only node a
    # replacement can go to is the one that was freed. hostNetwork pods are
    # blocked by the "baseline" and "restricted" Pod Security levels.
    hostNetwork: false
    # keys.cache_driver for the cluster key store. Empty = Salt's default
    # (localfs_key). Salt recommends mmap_key for isolated mode, but see the
    # chart CHANGELOG: it failed to read its own keys back on Longhorn PVCs.
    keysCacheDriver: ""
    # Per-pod volume (volumeClaimTemplates, named `state`): the master's own
    # keypair (subPath master-pki), and in isolated mode also cluster_pki_dir
    # (cluster-pki) and the cachedir (cache). In shared mode it only holds the
    # master's own keypair. Empty storageClassName = the cluster default.
    persistence:
      storageClassName: ""
      accessMode: ReadWriteOnce
      size: 5Gi
    # storageMode=shared only: an EXISTING ReadWriteMany PVC, used with
    # subPaths cluster-pki, cache, file-roots (/srv/salt) and pillar-roots
    # (/srv/pillar). The init container creates those directories as uid/gid
    # 10001, so the volume must already be writable by that user.
    sharedStorage:
      existingClaim: ""

  # The image runs as the 'salt' user, normalised to uid/gid 10001 in
  # src/master/Dockerfile, so the same numbers are used here. fsGroup makes
  # mounted volumes group-writable for that gid (needed by the non-root init
  # containers and by volumes you supply yourself).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch

  # No root and no added capabilities anywhere, including the init
  # containers: they run with this same context (as the master's own
  # non-root user) and create the directories they need themselves, instead
  # of a root init container chowning them. That works because the pod's
  # fsGroup (above) makes every volume root group-writable for gid 10001,
  # and a directory created by uid 10001 is owned by it. The same pattern is
  # used by the salt-minion chart. Consequence: any volume you supply
  # yourself (agent.cluster.sharedStorage.existingClaim) must already be
  # writable by that uid/gid.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  # Auto-accepts new minion keys instead of requiring a manual `salt-key -a`
  # per minion (or a SaltMinionKey CR, once salt-key-operator is installed).
  # An orthogonal, weaker "accept literally anyone" dev/test convenience -
  # convenient for dev/test labs; leave false for a production master.
  autoAccept: false

  # Sets `id:` on the master itself. Leave empty to use the pod hostname.
  # Does NOT need to be unique across replicas (unlike a minion ID) - a
  # minion's trust is gated by the master's keypair (masterKeySecretName
  # below), not by this grain, so every replica can share this value or
  # every replica can fall back to its own pod hostname; either is fine.
  masterId: ""

  # Fires salt/presence/present (and /change) events on the event bus, so
  # `salt-run manage.present`/`manage.status` reflect which minions are
  # actually connected right now - useful in Kubernetes, where minion pods
  # come and go independently of their accepted-key status.
  presenceEvents: true

  # Classic mode only (ignored when agent.cluster.enabled=true).
  #
  # Name of an EXISTING Kubernetes Secret (created out-of-band, never via
  # Helm values) with keys 'master.pem' and 'master.pub': the master's PEM
  # RSA keypair as raw files, e.g.
  #   kubectl create secret generic <name> -n <namespace> \
  #     --from-file=master.pem --from-file=master.pub
  # REQUIRED when replicas > 1 (every pod must present the identical
  # keypair, matching Salt's own multi-master convention - see
  # https://docs.saltproject.io/en/3008/topics/tutorials/multimaster.html,
  # "masters share the same private key") - the chart fails to render
  # otherwise. The Secret is mounted 0440 and copied by the prepare-master-keys
  # init container into a writable emptyDir.
  #
  # Empty = the Secret <release>-master-keys is used instead, created by the
  # master-keygen Job (an RSA 2048 pair, generated once; needs rbac.create)
  # if it does not exist yet. The pods wait in ContainerCreating until it
  # does. That is fine for a single replica, but it cannot be used with
  # replicas > 1 (set this value). Back the generated Secret up if minions
  # already trust it: a new keypair will not be trusted by minions that have
  # pinned the old one.
  masterKeySecretName: ""

  # Replaces manual `salt-key -a <minion-id>` with salt-key-operator's
  # SaltMinionKey CRD (see ../salt-key-operator). The operator maintains a
  # ConfigMap; a trusted-minions-sync sidecar in every master pod copies its
  # entries into writable emptyDirs mounted at <keys dir>/minions,
  # minions_pre and minions_rejected (<keys dir> is /etc/salt/pki/master, or
  # /etc/salt/pki/cluster in cluster mode). The sidecar also deletes any key
  # in minions/ that is not in the ConfigMap, so a key accepted by hand with
  # `salt-key -a` is removed again within syncIntervalSeconds: every accepted
  # minion must go through a SaltMinionKey instead. That is intentional:
  # across several replicas, mixing operator-managed and manually accepted
  # keys would mean different replicas disagreeing on who is trusted. Set
  # false to keep the traditional salt-key workflow (fine for a single
  # replica; does NOT give consistent acceptance across classic replicas > 1).
  #
  # Enabled by default, which makes the salt-key-operator subchart part of
  # the release (run `helm dependency update` first, see Chart.yaml).
  trustedMinions:
    enabled: true
    # Set false to reference an existing ConfigMap (e.g. created by another
    # tool) instead of having this chart create one.
    createConfigMap: true
    configMapName: salt-master-trusted-minions
    # How often the trusted-minions-sync sidecar re-copies the ConfigMap
    # into the writable directory Salt actually reads. Total worst-case
    # propagation is this plus kubelet's own ConfigMap-volume resync
    # period (on the order of a minute) - the sidecar can only see updates
    # once kubelet has already synced the ConfigMap's mounted content.
    syncIntervalSeconds: 15

  # Classic mode only (ignored in cluster mode, where the per-pod `state`
  # volume holds the cache). The master's identity comes from the key Secret
  # and, with trustedMinions enabled, the accepted-minion keys come from the
  # operator's ConfigMap, so no PKI is persisted in classic mode. What can
  # still benefit from persistence is the job/event cache (jobs dispatched and
  # their returns): when enabled, a per-replica PVC (volumeClaimTemplates,
  # named job-cache) is mounted at /var/cache/salt/master/jobs. Off by
  # default, in which case the job cache is lost when a pod is replaced.
  jobCache:
    persistence:
      enabled: false
      # Empty uses the cluster's default StorageClass. No hostPath option
      # here on purpose - each StatefulSet replica gets its own exclusive
      # PVC via volumeClaimTemplates, and per-ordinal hostPath would need a
      # per-ordinal nodeSelector, which a single StatefulSet template can't
      # express.
      storageClassName: ""
      accessMode: ReadWriteOnce
      size: 1Gi

  # Pins every replica to a node (e.g. {kubernetes.io/hostname: k8s-cp}).
  # Not needed for the PVCs above (normal StorageClass volumes, one per
  # ordinal, no node affinity required) - only relevant if your cluster needs
  # it for other reasons. `kubectl get nodes` for hostnames.
  nodeSelector: {}

serviceAccount:
  name: salt-master
  # Add EKS IRSA or other provider-specific annotations here.
  annotations: {}

service:
  # ClusterIP by default - standard practice: nothing is reachable from
  # outside the cluster unless you explicitly opt into one of the
  # mechanisms below.
  #
  # This is the flat `salt-master` Service in front of every pod. In cluster
  # mode it is the intended minion endpoint (any master can serve any minion).
  # With replicas: 1 it is simply the master. With classic multi-master
  # (replicas > 1, no cluster) it only load-balances per connection, so
  # minions should instead list each pod through the always-created headless
  # Service `salt-master-headless` (per-pod DNS names, see
  # templates/service-headless.yaml). There is no per-replica Service for
  # external minions; external access to individual classic replicas is not
  # provided by this chart.
  type: ClusterIP

  # Only used when type=NodePort - exposes the port directly on every
  # node's own IP. Not standard practice for a production cluster (opens a
  # host-level port on every node regardless of where the pod is actually
  # scheduled) - prefer service.gateway below if you have a Gateway
  # API-compatible controller (e.g. Envoy Gateway) available.
  nodePorts:
    publish: 30505
    ret: 30506

  # Exposes this same single Service through a Gateway API TCPRoute
  # (gateway.networking.k8s.io) instead - e.g. Envoy Gateway, which
  # supports raw TCP passthrough. A standard Kubernetes Ingress cannot do
  # this at all: Ingress is HTTP(S)-only, and Salt's 4505/4506 carry raw
  # ZeroMQ traffic, not HTTP. This does NOT create a Gateway - that's a
  # cluster-level object your platform team manages separately, with two
  # TCP listeners already defined (one per port) for these TCPRoutes to
  # attach to by name.
  gateway:
    enabled: false
    gatewayName: ""
    # Defaults to this release's own namespace when empty.
    gatewayNamespace: ""
    publishSectionName: salt-publish
    retSectionName: salt-ret

# The one-time Job that generates the master keypair Secret (classic mode,
# when agent.masterKeySecretName is empty and the Secret does not exist).
# The image needs kubectl and openssl.
keygen:
  image:
    repository: bitnami/kubectl
    tag: latest
    pullPolicy: Always
    imagePullSecrets: []
  # Restricted by default; the Job only needs to create one Secret. runAsNonRoot
  # needs an image whose default user is not root (bitnami/kubectl is not).
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
# end of values
