image:
  # Build from src/salt-key-operator (docs/building.md). The release workflow
  # pushes to ghcr.io/<owner>/salt-key-operator (docs/releasing.md); check
  # the path you actually publish and override repository to match.
  # Distroless static image - runs as the built-in "nonroot" user (uid/gid 65532), no numeric override needed here the way
  # this repo's other (apt/onedir-based) images require.
  repository: ghcr.io/saltstack/salt-key-operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Deliberately a single, lightweight controller - one SaltMinionKey/master
# pairing per namespace (see watchNamespace below) doesn't need a
# highly-available control plane the way the master tier it feeds does.
# Bump this only alongside leaderElection.enabled below.
replicas: 1

# Restricts the operator's watches to a single namespace, and gives it a
# namespaced Role (in that namespace) instead of a cluster-wide ClusterRole:
# the smallest footprint this operator can run with. Empty (the default) means
# the namespace this release is installed into, so installing the operator
# (or the salt-master chart that bundles it) into the namespace of the
# salt-master release needs no further configuration. Set it only to watch a
# different single namespace.
watchNamespace: ""

# Watch every namespace, with a ClusterRole, instead of a single one. Only for a
# genuine multi-tenant cluster with SaltMinionKey objects and target master
# releases spread across namespaces. Takes precedence over watchNamespace.
clusterWide: false

# Leader election exists to let >1 operator replica run without split-brain
# writers - irrelevant, and pure overhead, at the default replicas: 1.
# Turn this on together with raising replicas above if this operator's own
# availability ever needs to match the active-active master tier it feeds.
leaderElection:
  enabled: false

serviceAccount:
  name: salt-key-operator
  annotations: {}

# No numeric runAsUser/runAsGroup here on purpose - distroless/static's
# "nonroot" base image variant already runs as a fixed, stable uid/gid
# (65532) baked into the image itself, unlike this repo's other images
# (which resolve a 'salt' user created by apt/onedir install steps that
# aren't guaranteed stable across base-image updates).
podSecurityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Deliberately small - this controller does nothing but watch a handful of
# API objects and occasionally patch one ConfigMap; it's not expected to
# ever need more than this regardless of minion count (see README.md's
# ConfigMap-size-ceiling note for the actual scaling limit, which isn't CPU/
# memory-bound).
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
