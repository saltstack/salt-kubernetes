# Salt Kubernetes Minion - Test Configuration
# Usage: helm install salt-minion ./helm/salt-minion -f test-values-k8s-minion.yaml

namespace: salt

agent:
  authMode: in_cluster
  replicas: 1

  image:
    repository: ghcr.io/saltstack/salt-kubernetes/salt-minion
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # Salt master configuration (REQUIRED for in_cluster mode)
  saltMasterHost: "salt-master.salt.svc.cluster.local"
  saltMasterPort: 4506
  saltPublishPort: 4505

  # Authentication and reconnection settings
  authTimeout: 60
  masterAliveInterval: 60
  reconDefault: 1000
  reconMax: 5000
  reconRandomize: true

  # Logging
  logLevel: info

  # Minion identity and keys
  minion:
    id: ""  # Use pod hostname if empty
    masterId: ""
    masterPubKeyB64: ""
    # Use existing secret or let keygen-job create it
    keySecretName: ""
    allowSelfGeneratedKey: false
    # Only used if keySecretName is not set
    privateKeyB64: ""
    publicKeyB64: ""

  # PKI/Key persistence
  persistence:
    enabled: false  # Set to true for production
    type: pvc
    pvc:
      existingClaim: ""
      storageClassName: ""  # Uses cluster default if empty
      accessMode: ReadWriteOnce
      size: 1Gi
    hostPath:
      path: /var/lib/salt-minion/pki

  # Node affinity (required if persistence.type=hostPath)
  nodeSelector: {}

  # Vault integration (optional)
  vault:
    addr: ""
    authMethod: approle
    roleId: ""
    secretId: ""
    secretIdFile: ""
    token: ""
    tokenFile: ""
    sdbProfile: vault_sdb

serviceAccount:
  name: salt-minion
  annotations: {}

rbac:
  create: true
  roleName: salt-minion
  fullAccess: true
  customRoleRules: []
  customClusterRoleRules: []
